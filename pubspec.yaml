name: ayubo_customer_app
description: "A modern organic products customer mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons & Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # Networking & Storage
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  image_picker: ^1.2.2

  # State Management & Localization
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # Generates localization code automatically from ARB files

  assets:
    - assets/images/
    - assets/videos/